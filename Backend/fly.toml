# fly.toml app configuration file generated for bakery-website-backend on 2026-11-15T17:57:57Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'bakery-website-backend'
primary_region = 'lhr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
